<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claro Jatuarana | Atendimento</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f7f7f7,#ededed);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#191919}
.wrap{max-width:480px;margin:0 auto;padding:28px 18px 34px}
.header{background:#d71920;border-radius:0 0 28px 28px;margin:-28px -18px 28px;padding:34px 22px 30px;text-align:center;color:white}
.logo{font-size:36px;font-weight:900;letter-spacing:-2px}
.subtitle{margin-top:8px;font-size:16px;opacity:.95}
.card{background:white;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.desc{text-align:center;color:#777;font-size:14px;margin-bottom:20px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:17px 16px;margin:12px 0;border-radius:15px;
text-decoration:none;font-weight:750;font-size:16px;transition:.15s}
.btn:active{transform:scale(.98)}
.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}
.insta{background:#f1f1f1;color:#111} .insta .icon{background:#111;color:#fff}
.whats{background:#e9faef;color:#116b36} .whats .icon{background:#25D366;color:#fff}
.google{background:#f7f7f7;color:#222} .google .icon{background:#fff;border:1px solid #ddd}
.manager{background:#fff0f0;color:#a30f15} .manager .icon{background:#d71920;color:#fff}
.footer{text-align:center;color:#888;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">CLARO</div>
    <div class="subtitle">Jatuarana • Atendimento</div>
  </div>
  <div class="card">
    <div class="title">Como podemos ajudar?</div>
    <div class="desc">Escolha uma opção abaixo</div>

    <a class="btn insta" href="https://www.instagram.com/claro_jatuarana?stkn=M3hkZjM5d3dlcnR0&utm_source=qr" target="_blank" rel="noopener">
      <span class="icon">◎</span><span>Instagram da loja</span>
    </a>

    <a class="btn whats" href="https://wa.me/5569992321001" target="_blank" rel="noopener">
      <span class="icon">◉</span><span>WhatsApp da loja</span>
    </a>

    <a class="btn google" href="https://share.google/Y7I81ZiKZR8j8EyPG" target="_blank" rel="noopener">
      <span class="icon">★</span><span>Avaliar nossa loja no Google</span>
    </a>

    <a class="btn manager" href="https://wa.me/5569993684606" target="_blank" rel="noopener">
      <span class="icon">👤</span><span>Falar com o gerente</span>
    </a>
  </div>
  <div class="footer">Claro Jatuarana • Porto Velho - RO</div>
</div>
</body>
</html>
